name: Kafka Producer

on:
  workflow_dispatch:

jobs:
  produce:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r producer/requirements.txt

      - name: Configure Aiven CA certificate
        env:
          KAFKA_CA_PEM: ${{ secrets.KAFKA_CA_PEM }}
        run: |
          printf '%s\n' "$KAFKA_CA_PEM" > "$RUNNER_TEMP/aiven-ca.pem"
          echo "KAFKA_CA_FILE=$RUNNER_TEMP/aiven-ca.pem" >> "$GITHUB_ENV"

      - name: Send Kafka event
        env:
          KAFKA_HOST: ${{ secrets.KAFKA_HOST }}
          KAFKA_PORT: ${{ secrets.KAFKA_PORT }}
          KAFKA_USERNAME: ${{ secrets.KAFKA_USERNAME }}
          KAFKA_PASSWORD: ${{ secrets.KAFKA_PASSWORD }}
        run: |
          python producer/producer.py
